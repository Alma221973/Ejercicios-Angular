
<main>
  <h1>Iniciar sesión - Agenda de tareas</h1>

  <form (ngSubmit)="iniciarSesion()">

    <label for="usuario">Usuario</label>
    <input
      id="usuario"
      name="usuario"
      type="text"
      [(ngModel)]="usuario"
      required>

    <label for="clave">Contraseña</label>
    <input
      id="clave"
      name="clave"
      type="password"
      [(ngModel)]="clave"
      required>

    <button type="submit">Ingresar</button>

  </form>
</main>
